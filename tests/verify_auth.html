<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Auth & Admin Navigation Test</title>
</head>
<body>
  <!-- Header Auth Elements -->
  <div id="headerAuthArea">
    <button type="button" id="headerGoogleLoginBtn"><span>دخول Google</span></button>
    <div id="headerUserPill" hidden>
      <img id="headerUserAvatar" src="" hidden>
      <span id="headerUserName"></span>
      <button type="button" id="headerSignOutBtn">خروج</button>
    </div>
    <a href="#admin" id="headerAdminBtn" hidden>لوحة التحكم</a>
  </div>
  <a href="#admin" id="navAdminLink" hidden>لوحة التحكم</a>

  <!-- Storefront Main View -->
  <main id="storefront">
    <h1>محتوى المتجر</h1>
  </main>

  <!-- Admin View -->
  <section id="adminView" hidden>
    <div id="adminHeading" hidden>
      <h2>عنوان الإدارة</h2>
    </div>
    <div id="adminLogin" hidden>
      <form id="adminPinForm">
        <input type="password" id="adminPinInput">
        <input type="checkbox" id="adminRememberMe" checked>
        <button type="submit" id="adminPinSubmitBtn">دخول لوحة التحكم</button>
      </form>
      <button id="googleSignInBtn">تسجيل الدخول كأدمن</button>
      <div id="loginError" hidden><span id="loginErrorText"></span></div>
    </div>
    <div id="adminWorkspace" hidden>
      <strong id="connectionStatus"></strong>
      <span id="adminRoleBadge"></span>
      <span id="sessionTimerText">60:00</span>
      <span id="draftStatus"></span>
    </div>
  </section>

  <div id="toast" hidden></div>
  <div id="results"></div>

  <script src="../assets/icons.js"></script>
  <script src="../assets/catalog.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/admin.js"></script>

  <script>
    window.__KENO_TEST_ENV__ = true;
    const $ = id => document.getElementById(id);
    const results = [];
    function assert(desc, condition) {
      const res = (condition ? 'PASS: ' : 'FAIL: ') + desc;
      results.push(res);
      console.log(res);
    }

    let downloadAttempts = [];
    const origAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function() {
      if (this.download) {
        downloadAttempts.push(this.download);
      }
      return origAnchorClick.apply(this, arguments);
    };

    // Mock KenoFirebase methods for testing
    let mockUser = null;
    window.KenoFirebase.getCurrentUser = () => mockUser;
    window.KenoFirebase.signInWithGoogle = async () => mockUser;
    window.KenoFirebase.signOut = async () => { mockUser = null; };
    window.KenoFirebase.checkAdminAuthorization = async (email) => {
      if (email === 'admin@keno.com') {
        return { authorized: true, role: 'OWNER' };
      }
      return { authorized: false };
    };

    // Storefront Auth Logic
    function setupStorefrontAuth() {
      const loginBtn = $('headerGoogleLoginBtn');
      const userPill = $('headerUserPill');
      const userAvatar = $('headerUserAvatar');
      const userName = $('headerUserName');
      const adminBtn = $('headerAdminBtn');
      const navAdminLink = $('navAdminLink');
      const signOutBtn = $('headerSignOutBtn');

      async function applyAuthState(user) {
        if (!user) {
          if (loginBtn) {
            loginBtn.hidden = false;
            loginBtn.disabled = false;
          }
          if (userPill) userPill.hidden = true;
          if (adminBtn) adminBtn.hidden = true;
          if (navAdminLink) navAdminLink.hidden = true;
          return;
        }

        if (loginBtn) loginBtn.hidden = true;
        if (userPill) {
          userPill.hidden = false;
          if (userName) userName.textContent = user.displayName || user.email.split('@')[0];
          if (userAvatar) {
            if (user.photoURL) {
              userAvatar.src = user.photoURL;
              userAvatar.hidden = false;
            } else {
              userAvatar.hidden = true;
            }
          }
        }

        let isAdmin = false;
        let role = null;
        try {
          if (window.KenoFirebase && typeof window.KenoFirebase.checkAdminAuthorization === 'function') {
            const authCheck = await window.KenoFirebase.checkAdminAuthorization(user.email);
            if (authCheck && authCheck.authorized) {
              isAdmin = true;
              role = String(authCheck.role || 'OWNER').toUpperCase();
            }
          }
        } catch (err) {
          console.warn('Failed checking admin role:', err);
        }

        if (isAdmin) {
          if (adminBtn) adminBtn.hidden = false;
          if (navAdminLink) navAdminLink.hidden = false;

          const sessionPayload = {
            role,
            repo: '',
            branch: 'main',
            token: '',
            email: user.email,
            name: user.displayName || user.email,
            photo: user.photoURL || '',
            authTime: Date.now(),
            expiresAt: Date.now() + 3600000
          };
          try {
            sessionStorage.setItem('keno_admin_session_v3', JSON.stringify(sessionPayload));
          } catch (_) {}

          if (window.KenoAdminAuth && typeof window.KenoAdminAuth.setSession === 'function') {
            window.KenoAdminAuth.setSession(role, sessionPayload);
          }
        } else {
          if (adminBtn) adminBtn.hidden = true;
          if (navAdminLink) navAdminLink.hidden = true;
          try { sessionStorage.removeItem('keno_admin_session_v3'); } catch (_) {}
        }
      }

      function route() {
        const hash = location.hash;
        const isAdminRoute = hash === '#admin' || hash.startsWith('#admin/');
        if ($('storefront')) $('storefront').hidden = isAdminRoute;
        if ($('adminView')) $('adminView').hidden = !isAdminRoute;

        if (isAdminRoute && window.KenoAdmin) {
          window.KenoAdmin.init();
        }
      }

      window.addEventListener('hashchange', route);
      window.__testRoute = route;

      const handleAdminClick = (e) => {
        e.preventDefault();
        location.hash = '#admin';
        route();
      };

      if (adminBtn) adminBtn.addEventListener('click', handleAdminClick);
      if (navAdminLink) navAdminLink.addEventListener('click', handleAdminClick);

      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          loginBtn.disabled = true;
          const user = await window.KenoFirebase.signInWithGoogle();
          if (user) await applyAuthState(user);
          loginBtn.disabled = false;
        });
      }

      if (signOutBtn) {
        signOutBtn.addEventListener('click', async () => {
          await window.KenoFirebase.signOut();
          try { sessionStorage.removeItem('keno_admin_session_v3'); } catch (_) {}
          await applyAuthState(null);
          location.hash = '#catalog';
          route();
        });
      }

      window.__applyAuthState = applyAuthState;
    }

    async function executeTests() {
      setupStorefrontAuth();

      // Test 1: Guest (not logged in)
      await window.__applyAuthState(null);
      assert('1. Guest: Login button visible', !$('headerGoogleLoginBtn').hidden);
      assert('2. Guest: User pill hidden', $('headerUserPill').hidden);
      assert('3. Guest: Admin button hidden', $('headerAdminBtn').hidden);
      assert('4. Guest: Nav admin link hidden', $('navAdminLink').hidden);

      // Test 2: Regular Customer signs in
      mockUser = { email: 'customer@example.com', displayName: 'سارة العميل' };
      $('headerGoogleLoginBtn').click();
      await new Promise(r => setTimeout(r, 100));

      assert('5. Customer: Login button hidden', $('headerGoogleLoginBtn').hidden);
      assert('6. Customer: User pill visible', !$('headerUserPill').hidden);
      assert('7. Customer: User name displayed', $('headerUserName').textContent === 'سارة العميل');
      assert('8. Customer: Admin button STRICTLY hidden', $('headerAdminBtn').hidden);
      assert('9. Customer: Nav admin link STRICTLY hidden', $('navAdminLink').hidden);
      assert('10. Customer: No admin session', sessionStorage.getItem('keno_admin_session_v3') === null);

      // Test 3: Logout Customer
      $('headerSignOutBtn').click();
      await new Promise(r => setTimeout(r, 100));
      assert('11. Logout: Login button visible', !$('headerGoogleLoginBtn').hidden);
      assert('12. Logout: User pill hidden', $('headerUserPill').hidden);
      assert('13. Logout: Admin button hidden', $('headerAdminBtn').hidden);

      // Test 4: Admin signs in
      mockUser = { email: 'admin@keno.com', displayName: 'مصطفى كينو' };
      $('headerGoogleLoginBtn').click();
      await new Promise(r => setTimeout(r, 100));

      assert('14. Admin: Login button hidden', $('headerGoogleLoginBtn').hidden);
      assert('15. Admin: User pill visible', !$('headerUserPill').hidden);
      assert('16. Admin: Admin button IS VISIBLE', !$('headerAdminBtn').hidden);
      assert('17. Admin: Nav admin link IS VISIBLE', !$('navAdminLink').hidden);
      const session = JSON.parse(sessionStorage.getItem('keno_admin_session_v3') || '{}');
      assert('18. Admin: Session role is OWNER', session.role === 'OWNER');

      // Test 5: Click on Admin Button! (The exact issue user reported!)
      $('headerAdminBtn').click();
      await new Promise(r => setTimeout(r, 150));

      assert('19. Admin Click: Storefront is HIDDEN', $('storefront').hidden === true);
      assert('20. Admin Click: AdminView is VISIBLE', $('adminView').hidden === false);
      assert('21. Admin Click: AdminWorkspace is UNLOCKED & VISIBLE', $('adminWorkspace').hidden === false);
      assert('22. Admin Click: AdminLogin is HIDDEN', $('adminLogin').hidden === true);
      assert('23. Zero Auto-Downloads: No files downloaded automatically', downloadAttempts.length === 0);

      // Test 6: Sign out from Admin
      $('headerSignOutBtn').click();
      await new Promise(r => setTimeout(r, 100));
      assert('24. Admin Logout: Admin button hidden', $('headerAdminBtn').hidden);
      assert('25. Admin Logout: Storefront restored', $('storefront').hidden === false);
      assert('26. Admin Logout: AdminView hidden', $('adminView').hidden === true);
      assert('27. Admin Logout: Session cleared', sessionStorage.getItem('keno_admin_session_v3') === null);

      // Test 7: Master PIN Login (Offline / Local / Fallback)
      $('adminPinInput').value = '2026';
      $('adminPinForm').dispatchEvent(new Event('submit'));
      await new Promise(r => setTimeout(r, 100));

      const pinSession = window.KenoAdmin.auth.getSession();
      assert('28. PIN Login: Session created with OWNER role', pinSession && pinSession.role === 'OWNER');
      assert('29. PIN Login: Admin button visible in header', !$('headerAdminBtn').hidden);
      assert('30. PIN Login: AdminWorkspace unlocked', $('adminWorkspace').hidden === false);
      assert('31. PIN Login: AdminLogin hidden', $('adminLogin').hidden === true);
      assert('32. PIN Login: Persisted in localStorage', localStorage.getItem('keno_admin_session_v3') !== null);

      // Test 8: Logout from PIN Session
      window.KenoAdmin.auth.logout();
      assert('33. PIN Logout: Storage cleared', localStorage.getItem('keno_admin_session_v3') === null);

      // Test 9: Wrong PIN rejection
      let pinErrorCaught = false;
      try {
        window.KenoAdmin.auth.loginWithPin('wrong-pin');
      } catch (e) {
        pinErrorCaught = true;
      }
      assert('34. Security: Incorrect PIN rejected', pinErrorCaught);

      $('results').innerHTML = results.map(r => `<div>${r}</div>`).join('');
      document.body.setAttribute('data-done', 'true');
    }

    executeTests();
  </script>
</body>
</html>
